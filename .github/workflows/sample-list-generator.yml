name: Sample List Generator
on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: ./.repo/sample-list-generator

# This job only reads the checkout; the artifact upload needs nothing more.
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate sample list
        run: npm run start

      - name: Upload to artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-samples.json
          path: ./.repo/sample-list-generator/extension-samples.json
          if-no-files-found: error
