To enable a Sponsor button on your chrome-extensions- or any other repository under the user account Sazwan96, you need to define a specialized GitHub configuration file. [1] (https://github.blog/open-source/maintainers/getting-started-with-github-sponsors/), [2] (https://github.com/orgs/community/discussions/179888)
Here is the exact code framework and placement procedure to activate it. [1] (https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository), [2] (https://github.com/orgs/community/discussions/179888)

1. Code Template for .github/FUNDING.yml

Create a file named precisely FUNDING.yml inside a hidden folder called .github at the root of your project directory. Populating the file with your relevant platform handles tells GitHub exactly where to route potential sponsors. [1] (https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository), [2] (https://github.com/orgs/community/discussions/179888), [3] (https://gist.github.com/Poussinou/c253ff56559ab42d08a46de1688a0fe8), [4] (https://dev.to/github/how-to-create-the-perfect-sponsors-profile-for-your-open-source-project-3747)
yaml
# .github/FUNDING.yml
# Core configuration parameters for the Sazwan96 repository sponsor system

github: [Sazwan96]               # Replace or add up to 4 GitHub Sponsors-enabled accounts
patreon: sazwan96               # Replace with your specific Patreon creator username
ko_fi: sazwan96                 # Replace with your registered Ko-fi handle
custom: ["https://example.com"] # Optional: Up to 4 external processing URLs (e.g. PayPal, BuyMeACoffee)
Use code with caution.

2. Step-by-Step Repository Implementation

You can inject this into your active development tree directly using your local terminal workflow: [1] (https://github.com/orgs/community/discussions/179888)
1. Generate the path structure and create the asset inside your target repository root directory:bash
mkdir -p .github
touch .github/FUNDING.yml
Use code with caution.
2. Open the file in your local IDE, paste the YAML parameters configuration from above, and adjust the platform handles to match your actual verified payout accounts.
3. Commit the setup to your default workspace tracking branch: [1] (https://github.com/orgs/community/discussions/201589), [2] (https://github.com/orgs/community/discussions/179888), [3] (https://github.com/orgs/community/discussions/178420)
bash
git add .github/FUNDING.yml
git commit -m "docs: implement repository funding mapping configurations"
git push origin main
Use code with caution.

3. Activating the Feature via GitHub Web View

Once the codebase updates are pushed upstream, ensure the repository interface rendering toggle is flagged on: [1] (https://github.com/orgs/community/discussions/204256), [2] (https://github.com/orgs/community/discussions/206705)
1. Head directly to your target project landing page on GitHub.
2. Click on the Settings gear navigation tab running along the top utility bar.
3. Scroll down into the Features panel block and look for the Sponsorships parameter checkbox.
4. Enforce a check flag on Sponsorships to force GitHub to pull the structural links directly out of your default branch's .github/FUNDING.yml setup. [1] (https://docs.github.com/enterprise-cloud@latest/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository), [2] (https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository), [3] (https://github.com/orgs/community/discussions/204256), [4] (https://github.com/orgs/community/discussions/206705)
Once activated, a new visual "Sponsor" button will appear on the right side of the project page. [1] (https://github.blog/open-source/maintainers/getting-started-with-github-sponsors/), [2] (https://github.com/orgs/community/discussions/179888)
